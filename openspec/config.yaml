schema: spec-driven

context: |
  Проект «Ищу компанию»: сервис совместных активностей (см. docs/project.md).
  Стек: Vue 3 + TypeScript + Vite, Python (FastAPI, SQLAlchemy 2, Alembic), PostgreSQL, Docker Compose.
  Все артефакты пишутся на русском языке.
  Авторизация обязательна для всех функций, кроме регистрации и входа.
  Бизнес-требования поступают порциями: не добавлять правила, которых пользователь не формулировал, — выносить их в открытые вопросы.
  Нефункциональные требования — docs/nfr.md, правила разработки — docs/rules.md.

rules:
  proposal:
    - Явно указывать, что не входит в scope изменения
  specs:
    - Для каждого требования с ограничением (лимит, права, даты) добавлять сценарий граничного случая
    - Для операций, изменяемых конкурентно, описывать поведение при одновременных запросах
  design:
    - Указывать изменения схемы БД и необходимые миграции Alembic
  tasks:
    - Включать задачи на автотесты для каждого требования из спеки
    - Включать задачу на обновление README/docs, если меняются запуск, стек или структура
