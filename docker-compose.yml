version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: book_exchange
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/book_exchange
      SECRET_KEY: your-secret-key-change-in-production
    depends_on:
      - db

volumes:
  postgres_data: