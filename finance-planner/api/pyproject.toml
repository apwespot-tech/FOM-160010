[project]
name = "finance-planner-api"
version = "0.1.0"
description = "Backend of the personal finance planner"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2,<6.2",
    "django-ninja>=1.7.1,<2",
    "psycopg[binary]>=3.3.6,<4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17,<7",
    "pytest>=9.2.0,<10",
    "pytest-django>=4.14.0,<5",
    "ruff>=0.17.6,<0.18",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "finance_planner.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "Q", "TID252"]

[tool.ruff.lint.flake8-quotes]
avoid-escape = false
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.uv]
package = false
